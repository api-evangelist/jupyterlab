aid: jupyterlab
name: JupyterLab
description: >-
  JupyterLab is the next-generation web-based interactive development environment for notebooks, code, and data. It is
  served by Jupyter Server and ships with JupyterLab Server, which provides REST APIs for user-defined settings,
  workspaces, themes, translations, and license reports, alongside the JavaScript and TypeScript extension API used to
  build JupyterLab plugins.
